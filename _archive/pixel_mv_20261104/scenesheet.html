<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>像素场景库</title>
<style>
  :root { --bg:#14131F; --panel:#1B1A28; --line:#2E2C42; --text:#E8E5F2; --dim:#8B86B0; --gold:#FFD166; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif; padding:40px 48px 70px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:.06em; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:32px; }
  h2 { font-size:13px; font-weight:600; letter-spacing:.16em; color:var(--gold); margin:38px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  h2 span { color:var(--dim); font-weight:400; letter-spacing:0; margin-left:10px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); padding:8px 8px 6px; }
  .card canvas { display:block; width:100%; image-rendering:pixelated; }
  .cap { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; font-size:10px; color:var(--dim); }
  .cap b { color:var(--text); font-weight:500; font-size:11px; letter-spacing:.06em; }
  .tag { font-family:ui-monospace,monospace; font-size:9px; color:#5A5878; }
</style>
</head>
<body>

<h1>像素场景库 · v1</h1>
<div class="sub">12 个场景 · 320×180 · 同一套 16 色 · 每场景只留一个暖黄光源</div>

<h2>场景总表 <span>每格为该场景的时间帧 t=1.2s</span></h2>
<div class="grid" id="bare"></div>

<h2>带人物 <span>同一场景 + 两个角色，检验构图与地面线</span></h2>
<div class="grid" id="withfig"></div>

<script src="src/rig.js"></script>
<script src="src/scene.js"></script>
<script>
const $ = s => document.querySelector(s);

function mkCard(container, name, t, withFigures) {
  const d = document.createElement('div'); d.className = 'card';
  const cv = document.createElement('canvas');
  cv.width = 320; cv.height = 180;
  const c = cv.getContext('2d');
  c.imageSmoothingEnabled = false;
  const s = SCENES[name];
  s.draw(c, t);
  if (withFigures) {
    const gy = s.gy;
    // 左边角色略微靠后（尺寸小 1 档），右边靠前
    figure(c, 128, gy - 2, 2, { sex: 'm', eyes: 'narrow', mouth: 'frown', pose: 'walk', walk: 1.4, aL: .2, aR: .2, dy: -1 });
    figure(c, 186, gy + 2, 2, {
      sex: 'f', eyes: t > 1 ? 'cry' : 'normal', mouth: 'frown', tear: .8,
      pose: 'walk', walk: 1.4, aL: 1.1, aR: 1.1, dy: -1
    });
  }
  if (s.fg) s.fg(c, t);
  d.appendChild(cv);
  const cap = document.createElement('div'); cap.className = 'cap';
  cap.innerHTML = `<b>${s.name}</b><span class="tag">gy=${s.gy}</span>`;
  d.appendChild(cap);
  container.appendChild(d);
}

for (const name of SCENE_LIST) mkCard($('#bare'), name, 1.2, false);
for (const name of SCENE_LIST) mkCard($('#withfig'), name, 1.2, true);

window.__ready = true;
</script>
</body>
</html>
