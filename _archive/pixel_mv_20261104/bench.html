<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>bench</title></head>
<body><canvas id="cv" width="320" height="180"></canvas>
<div id="r"></div>
<script src="src/rig.js"></script>
<script>
const cv = document.getElementById('cv'), c = cv.getContext('2d');
c.imageSmoothingEnabled = false;
const N = 120;                       // 一次渲染 120 帧（=5 秒 @24fps）的工作量
const t0 = performance.now();
for (let i = 0; i < N; i++) {
  const t = i / 24;
  c.fillStyle = '#1B1B2E'; c.fillRect(0, 0, 320, 180);
  c.fillStyle = '#2C2A4A'; c.fillRect(0, 96, 320, 84);
  for (let k = 0; k < 40; k++) { c.fillStyle = '#8B86B0'; c.fillRect((k * 37 + t * 60) % 320 | 0, (k * 53 + t * 240) % 180 | 0, 1, 3); }
  figure(c, 136, 160, 2, { sex: 'm', eyes: 'narrow', mouth: 'frown', pose: 'walk', walk: t * 6, aL: Math.sin(t * 6) * .3, aR: -.3, boilSeed: i });
  figure(c, 186, 160, 2, { sex: 'f', eyes: 'cry', mouth: 'open', pose: 'walk', walk: t * 6, tear: .8, aL: 1.2, aR: 1.1, dy: Math.round(Math.sin(t * 3)) });
  c.fillStyle = '#F2EFE5'; c.font = '13px sans-serif'; c.textAlign = 'center';
  c.fillText('我们的爱总有时差', 160, 172);
}
const ms = (performance.now() - t0) / N;
document.getElementById('r').textContent = 'per-frame: ' + ms.toFixed(1) + ' ms  (incl. two figures + rain + text @320x180)';
window.__ready = true;
</script></body></html>
