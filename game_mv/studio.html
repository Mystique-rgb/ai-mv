<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>最美的期待 · 综艺节奏扁平</title>
<style>
  /* 华文行楷：本地 STXINGKA.TTF 随项目一起带，headless Chrome 也能吃到 */
  @font-face { font-family: "PiaoyiKai"; src: url("assets/fonts/Xingkai.ttf") format("truetype"); font-weight: normal; font-style: normal; font-display: block; }
  @font-face { font-family: "PiaoyiKaiFallback"; src: url("assets/fonts/Kaiti.ttf") format("truetype"); font-weight: normal; font-style: normal; font-display: block; }
  html, body { margin: 0; background: #17141b; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #FFF6E8; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 200px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="42.667" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/gs.js"></script>
<script src="src/karaoke.js"></script>
<script src="src/scenes.js"></script>
</body>
</html>
