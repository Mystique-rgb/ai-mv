<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>别怕变老 · Risograph 手绘套印版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Shantell+Sans:wght@800&family=Ma+Shan+Zheng&display=block">
<style>
  /* 飘逸楷体：本地 Windows 的华文行楷（STXINGKA）随项目一起带，headless Chrome 也能吃到 */
  @font-face { font-family: "PiaoyiKai"; src: url("assets/fonts/Xingkai.ttf") format("truetype"); font-weight: normal; font-style: normal; font-display: block; }
  @font-face { font-family: "PiaoyiKaiFallback"; src: url("assets/fonts/Kaiti.ttf") format("truetype"); font-weight: normal; font-style: normal; font-display: block; }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F4EEE2; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="50.6" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<!-- risograph 套印层 + 字幕层 + 分镜 -->
<script src="src/riso.js"></script>
<script src="src/karaoke.js"></script>
<script src="src/scenes/mv.js"></script>
<script src="src/trans.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
